<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Pipeline Dispatcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 440px; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #60a5fa; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1.5px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #3b82f6; }
    button { width: 100%; background: #2563eb; color: #fff; border: none; padding: 13px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13px; display: none; text-align: center; }
    .success { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; }
    .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #b91c1c; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Queue YouTube Lecture</h1>
    <p>Submit a lecture link to add it directly to the automated notes compilation spreadsheet.</p>

    <div class="field">
      <label>Passkey</label>
      <input type="password" id="passkey" placeholder="Enter special key" required>
    </div>

    <div class="field">
      <label>YouTube Lecture URL</label>
      <input type="url" id="lectureUrl" placeholder="https://www.youtube.com/watch?v=..." required>
    </div>

    <button id="submitBtn" onclick="queueLecture()">Dispatch to Spreadsheet</button>
    <div id="status"></div>
  </div>

  <script>
    // Paste your Google Apps Script Web App Deployment URL here:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrKH1MZg5X1Mmm5PdhuOvneCODx_GXihFzL4B8x6ZPpp8lQdPlH_KvrQ-tNj25GE01/exec";

    async function queueLecture() {
      const key = document.getElementById("passkey").value.trim();
      const url = document.getElementById("lectureUrl").value.trim();
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      if (!key || !url) {
        showStatus("Please provide both passkey and lecture link.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Validating & Adding...";
      status.style.display = "none";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key: key, url: url })
        });

        const result = await response.json();

        if (result.status === "success") {
          showStatus(result.message, "success");
          document.getElementById("lectureUrl").value = "";
        } else {
          showStatus(result.message || "Failed to add lecture.", "error");
        }
      } catch (err) {
        showStatus("Error contacting Web App: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Dispatch to Spreadsheet";
      }
    }

    function showStatus(msg, type) {
      const status = document.getElementById("status");
      status.className = type;
      status.textContent = msg;
      status.style.display = "block";
    }
  </script>
</body>
</html>
