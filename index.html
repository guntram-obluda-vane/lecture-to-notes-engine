<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Lecture Notes Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #151d30;
      border: 1px solid #24324f;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.55);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .password-wrapper {
      position: relative;
      width: 100%;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 6px;
      border: 1.5px solid #293859;
      background: #0b0f19;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .password-wrapper input {
      padding-right: 60px;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    input::placeholder {
      color: #475569;
    }
    button.toggle-pwd {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      z-index: 10;
      width: auto !important;
      margin: 0 !important;
      padding: 4px 8px !important;
      background: #1e293b !important;
      border: 1px solid #334155 !important;
      border-radius: 4px !important;
      color: #94a3b8 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    button.toggle-pwd:hover {
      color: #ffffff !important;
      border-color: #3b82f6 !important;
    }
    #confirmBox {
      display: none;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    #confirmBox strong {
      color: #60a5fa;
    }
    #confirmBox .detail-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    button#submitBtn {
      flex: 1;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button#submitBtn:hover {
      background: #1d4ed8;
    }
    button#submitBtn.confirm-mode {
      background: #059669;
    }
    button#submitBtn.confirm-mode:hover {
      background: #047857;
    }
    button#submitBtn:active {
      transform: scale(0.99);
    }
    button#submitBtn:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    button#cancelBtn {
      display: none;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    button#cancelBtn:hover {
      background: #334155;
      color: #ffffff;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }
    .success {
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
    }
    .error {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }
    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Generate Lecture Notes</h1>
    <p class="subtitle">Paste a YouTube lecture link below to generate detailed PDF revision notes and have them sent straight to your inbox.</p>

    <div class="field">
      <label for="passkey">Access Passkey</label>
      <div class="password-wrapper">
        <input type="password" id="passkey" placeholder="Enter your access passkey" required autocomplete="off">
        <button type="button" id="togglePwdBtn" class="toggle-pwd">Show</button>
      </div>
    </div>

    <div class="field">
      <label for="lectureUrl">YouTube Lecture Link</label>
      <input type="url" id="lectureUrl" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
    </div>

    <div class="field">
      <label for="recipientEmail">Your Email Address</label>
      <input type="email" id="recipientEmail" placeholder="you@gmail.com" required autocomplete="email">
    </div>

    <div id="confirmBox">
      <div class="detail-line"><strong>Send PDF to:</strong> <span id="confirmEmail"></span></div>
      <div class="detail-line"><strong>Lecture:</strong> <span id="confirmUrl"></span></div>
    </div>

    <div class="btn-group">
      <button type="button" id="cancelBtn" onclick="resetConfirmation()">Cancel</button>
      <button type="button" id="submitBtn" onclick="handleSubmitClick()">Generate Notes</button>
    </div>

    <div id="status"></div>
    <div class="hint">Your PDF notes will arrive in your inbox within a few minutes.</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrKH1MZg5X1Mmm5PdhuOvneCODx_GXihFzL4B8x6ZPpp8lQdPlH_KvrQ-tNj25GE01/exec";
    let isConfirming = false;

    const passkeyInput = document.getElementById("passkey");
    const togglePwdBtn = document.getElementById("togglePwdBtn");

    togglePwdBtn.addEventListener("click", () => {
      const isHidden = passkeyInput.type === "password";
      passkeyInput.type = isHidden ? "text" : "password";
      togglePwdBtn.textContent = isHidden ? "Hide" : "Show";
    });

    ["passkey", "lectureUrl", "recipientEmail"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        if (isConfirming) resetConfirmation();
      });
    });

    function resetConfirmation() {
      isConfirming = false;
      const btn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const confirmBox = document.getElementById("confirmBox");

      btn.textContent = "Generate Notes";
      btn.classList.remove("confirm-mode");
      cancelBtn.style.display = "none";
      confirmBox.style.display = "none";
    }

    async function handleSubmitClick() {
      const keyInput = document.getElementById("passkey");
      const urlInput = document.getElementById("lectureUrl");
      const emailInput = document.getElementById("recipientEmail");
      const btn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const confirmBox = document.getElementById("confirmBox");
      const status = document.getElementById("status");

      const key = keyInput.value.trim();
      const url = urlInput.value.trim();
      const email = emailInput.value.trim();

      if (!key || !url || !email) {
        showStatus("Please fill in your passkey, lecture link, and email address.", "error");
        return;
      }

      if (!url.includes("youtu")) {
        showStatus("Please enter a valid YouTube lecture link.", "error");
        return;
      }

      if (!isConfirming) {
        isConfirming = true;
        status.style.display = "none";
        document.getElementById("confirmEmail").textContent = email;
        document.getElementById("confirmUrl").textContent = url;
        confirmBox.style.display = "block";
        cancelBtn.style.display = "block";
        btn.textContent = "Confirm & Submit";
        btn.classList.add("confirm-mode");
        return;
      }

      btn.disabled = true;
      cancelBtn.disabled = true;
      btn.textContent = "Submitting...";
      status.style.display = "none";

      const payload = JSON.stringify({
        key: key,
        url: url,
        email: email
      });

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: payload
        });

        const result = await response.json();

        if (result.status === "success") {
          showStatus("Got it! Your notes are being prepared and you'll receive the PDF in your mail in a bit.", "success");
          urlInput.value = "";
          emailInput.value = "";
          resetConfirmation();
        } else {
          showStatus(result.message || "Incorrect access passkey. Please try again.", "error");
          resetConfirmation();
        }
      } catch (err) {
        showStatus("Could not reach the server. Please check your connection and try again.", "error");
        resetConfirmation();
      } finally {
        btn.disabled = false;
        cancelBtn.disabled = false;
        if (!isConfirming) {
          btn.textContent = "Generate Notes";
        }
      }
    }

    function showStatus(msg, type) {
      const status = document.getElementById("status");
      status.className = type;
      status.textContent = msg;
      status.style.display = "block";
    }
  </script>
</body>
</html>
