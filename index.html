<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Lecture Notes Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #151d30;
      border: 1px solid #24324f;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.55);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 16px;
      transition: opacity 0.25s ease;
    }
    .locked-section {
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .passkey-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .password-wrapper {
      position: relative;
      flex: 1;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 6px;
      border: 1.5px solid #293859;
      background: #0b0f19;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .password-wrapper input {
      padding-right: 60px;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    input:disabled {
      background: #090d16;
      border-color: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    input::placeholder {
      color: #475569;
    }
    button.toggle-pwd {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      z-index: 10;
      width: auto !important;
      margin: 0 !important;
      padding: 4px 8px !important;
      background: #1e293b !important;
      border: 1px solid #334155 !important;
      border-radius: 4px !important;
      color: #94a3b8 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    button.toggle-pwd:hover {
      color: #ffffff !important;
      border-color: #3b82f6 !important;
    }
    button#unlockBtn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease;
    }
    button#unlockBtn:hover {
      background: #1d4ed8;
    }
    button#unlockBtn.unlocked {
      background: #059669;
      cursor: default;
    }
    button#unlockBtn:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    #confirmBox {
      display: none;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    #confirmBox strong {
      color: #60a5fa;
    }
    #confirmBox .detail-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    button#submitBtn {
      flex: 1;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button#submitBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button#submitBtn.confirm-mode {
      background: #059669;
    }
    button#submitBtn.confirm-mode:hover:not(:disabled) {
      background: #047857;
    }
    button#submitBtn:active:not(:disabled) {
      transform: scale(0.99);
    }
    button#submitBtn:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    button#cancelBtn {
      display: none;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    button#cancelBtn:hover {
      background: #334155;
      color: #ffffff;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }
    .success {
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
    }
    .error {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }
    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Generate Lecture Notes</h1>
    <p class="subtitle">Enter your access passkey to unlock the form, then paste a YouTube lecture link to receive PDF notes in your inbox.</p>

    <div class="field">
      <label for="passkey">Step 1: Access Passkey</label>
      <div class="passkey-row">
        <div class="password-wrapper">
          <input type="password" id="passkey" placeholder="Enter passkey to unlock" required autocomplete="off">
          <button type="button" id="togglePwdBtn" class="toggle-pwd">Show</button>
        </div>
        <button type="button" id="unlockBtn" onclick="verifyPasskey()">Unlock</button>
      </div>
    </div>

    <div id="lockedForm" class="locked-section">
      <div class="field">
        <label for="lectureUrl">Step 2: YouTube Lecture Link</label>
        <input type="url" id="lectureUrl" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off" disabled>
      </div>

      <div class="field">
        <label for="recipientEmail">Step 3: Your Email Address</label>
        <input type="email" id="recipientEmail" placeholder="you@gmail.com" required autocomplete="email" disabled>
      </div>

      <div id="confirmBox">
        <div class="detail-line"><strong>Send PDF to:</strong> <span id="confirmEmail"></span></div>
        <div class="detail-line"><strong>Lecture:</strong> <span id="confirmUrl"></span></div>
      </div>

      <div class="btn-group">
        <button type="button" id="cancelBtn" onclick="resetConfirmation()">Cancel</button>
        <button type="button" id="submitBtn" onclick="handleSubmitClick()" disabled>Generate Notes</button>
      </div>
    </div>

    <div id="status"></div>
    <div class="hint">Your PDF notes will arrive in your inbox within a few minutes.</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrKH1MZg5X1Mmm5PdhuOvneCODx_GXihFzL4B8x6ZPpp8lQdPlH_KvrQ-tNj25GE01/exec";
    let isUnlocked = false;
    let isConfirming = false;

    const passkeyInput = document.getElementById("passkey");
    const togglePwdBtn = document.getElementById("togglePwdBtn");

    togglePwdBtn.addEventListener("click", () => {
      const isHidden = passkeyInput.type === "password";
      passkeyInput.type = isHidden ? "text" : "password";
      togglePwdBtn.textContent = isHidden ? "Hide" : "Show";
    });

    // Allow pressing Enter inside passkey box to unlock
    passkeyInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !isUnlocked) {
        e.preventDefault();
        verifyPasskey();
      }
    });

    // Re-lock immediately if user modifies the passkey after unlocking
    passkeyInput.addEventListener("input", () => {
      if (isUnlocked) {
        setLockState(false);
        resetConfirmation();
      }
    });

    ["lectureUrl", "recipientEmail"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        if (isConfirming) resetConfirmation();
      });
    });

    function setLockState(unlocked) {
      isUnlocked = unlocked;
      const lockedForm = document.getElementById("lockedForm");
      const urlInput = document.getElementById("lectureUrl");
      const emailInput = document.getElementById("recipientEmail");
      const submitBtn = document.getElementById("submitBtn");
      const unlockBtn = document.getElementById("unlockBtn");

      if (unlocked) {
        lockedForm.classList.remove("locked-section");
        urlInput.disabled = false;
        emailInput.disabled = false;
        submitBtn.disabled = false;
        unlockBtn.textContent = "Unlocked ✓";
        unlockBtn.classList.add("unlocked");
      } else {
        lockedForm.classList.add("locked-section");
        urlInput.disabled = true;
        emailInput.disabled = true;
        submitBtn.disabled = true;
        unlockBtn.textContent = "Unlock";
        unlockBtn.classList.remove("unlocked");
      }
    }

    async function verifyPasskey() {
      if (isUnlocked) return;

      const key = passkeyInput.value.trim();
      const unlockBtn = document.getElementById("unlockBtn");
      const status = document.getElementById("status");

      if (!key) {
        showStatus("Please enter your access passkey first.", "error");
        return;
      }

      unlockBtn.disabled = true;
      unlockBtn.textContent = "Checking...";
      status.style.display = "none";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "verify",
            key: key
          })
        });

        const rawText = await response.text();
        const result = JSON.parse(rawText);

        if (result.status === "success") {
          setLockState(true);
          status.style.display = "none";
          document.getElementById("lectureUrl").focus();
        } else {
          setLockState(false);
          showStatus(result.message || "Incorrect access passkey. Form remains locked.", "error");
        }
      } catch (err) {
        setLockState(false);
        showStatus("Could not verify passkey. Please check your connection.", "error");
      } finally {
        unlockBtn.disabled = false;
        if (!isUnlocked) {
          unlockBtn.textContent = "Unlock";
        }
      }
    }

    function resetConfirmation() {
      isConfirming = false;
      const btn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const confirmBox = document.getElementById("confirmBox");

      btn.textContent = "Generate Notes";
      btn.classList.remove("confirm-mode");
      cancelBtn.style.display = "none";
      confirmBox.style.display = "none";
    }

    async function handleSubmitClick() {
      if (!isUnlocked) {
        showStatus("Please unlock the form with a valid passkey first.", "error");
        return;
      }

      const urlInput = document.getElementById("lectureUrl");
      const emailInput = document.getElementById("recipientEmail");
      const btn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const confirmBox = document.getElementById("confirmBox");
      const status = document.getElementById("status");

      const key = passkeyInput.value.trim();
      const url = urlInput.value.trim();
      const email = emailInput.value.trim();

      if (!url || !email) {
        showStatus("Please enter both the YouTube lecture link and your email address.", "error");
        return;
      }

      if (!url.includes("youtu")) {
        showStatus("Please enter a valid YouTube lecture link.", "error");
        return;
      }

      if (!isConfirming) {
        isConfirming = true;
        status.style.display = "none";
        document.getElementById("confirmEmail").textContent = email;
        document.getElementById("confirmUrl").textContent = url;
        confirmBox.style.display = "block";
        cancelBtn.style.display = "block";
        btn.textContent = "Confirm & Submit";
        btn.classList.add("confirm-mode");
        return;
      }

      btn.disabled = true;
      cancelBtn.disabled = true;
      btn.textContent = "Submitting...";
      status.style.display = "none";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            key: key,
            url: url,
            email: email
          })
        });

        const rawText = await response.text();
        const result = JSON.parse(rawText);

        if (result.status === "success") {
          showStatus("Got it! Your notes are being prepared and you'll receive the PDF in your mail in a bit.", "success");
          urlInput.value = "";
          emailInput.value = "";
          resetConfirmation();
        } else {
          showStatus(result.message || "Submission rejected. Please check your passkey.", "error");
          setLockState(false);
          resetConfirmation();
        }
      } catch (err) {
        showStatus("Could not reach the server. Please try again.", "error");
        resetConfirmation();
      } finally {
        btn.disabled = false;
        cancelBtn.disabled = false;
        if (!isConfirming) {
          btn.textContent = "Generate Notes";
        }
      }
    }

    function showStatus(msg, type) {
      const status = document.getElementById("status");
      status.className = type;
      status.textContent = msg;
      status.style.display = "block";
    }
  </script>
</body>
</html>
